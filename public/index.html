<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todos</title>
  <style>
    :root {
      --bg: #fafafa;
      --fg: #1a1a1a;
      --muted: #8a8a8a;
      --line: #e5e5e5;
      --accent: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #ededed;
        --muted: #777;
        --line: #2a2a2a;
        --accent: #ededed;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, sans-serif;
    }
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 15vh 16px 48px;
    }
    h1 {
      margin: 0 0 32px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    form {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--fg);
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 20px;
      outline: none;
    }
    input::placeholder { color: var(--muted); }
    button {
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
    }
    button:hover, button:focus-visible { color: var(--accent); }
    ul { list-style: none; margin: 16px 0 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
      overflow-wrap: anywhere;
    }
    li button { font-size: 20px; line-height: 1; opacity: 0; }
    li:hover button, li button:focus-visible { opacity: 1; }
    @media (hover: none) { li button { opacity: 1; } }
    .empty, .error { margin-top: 24px; color: var(--muted); font-size: 14px; }
    .error { color: #d14343; }
  </style>
</head>
<body>
  <main>
    <h1>Todos</h1>
    <form id="form">
      <input id="title" placeholder="What needs doing?" autocomplete="off" aria-label="New todo" required>
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <p id="empty" class="empty" hidden>Nothing to do.</p>
    <p id="error" class="error" hidden></p>
  </main>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('title');
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const error = document.getElementById('error');

    function showError(message) {
      error.textContent = message;
      error.hidden = !message;
    }

    function render(todos) {
      list.replaceChildren(...todos.map((todo) => {
        const li = document.createElement('li');
        const span = document.createElement('span');
        span.textContent = todo.title;

        const remove = document.createElement('button');
        remove.textContent = '×';
        remove.setAttribute('aria-label', `Delete "${todo.title}"`);
        remove.addEventListener('click', () => deleteTodo(todo.id));

        li.append(span, remove);
        return li;
      }));
      empty.hidden = todos.length > 0;
    }

    async function request(url, options) {
      const res = await fetch(url, options);
      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      return res.status === 204 ? null : res.json();
    }

    async function load() {
      try {
        render(await request('/api/todos'));
        showError('');
      } catch (err) {
        showError(err.message);
      }
    }

    async function deleteTodo(id) {
      try {
        await request(`/api/todos/${id}`, { method: 'DELETE' });
        await load();
      } catch (err) {
        showError(err.message);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const title = input.value.trim();
      if (!title) return;
      try {
        await request('/api/todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title }),
        });
        input.value = '';
        await load();
      } catch (err) {
        showError(err.message);
      }
    });

    load();
  </script>
</body>
</html>
